<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firefly Jar</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: #1a1330;
    font-family: 'Georgia', 'Palatino Linotype', serif;
  }
  canvas { display: block; }
  body.playing { cursor: none; }
  body.playing #overlay button { cursor: pointer; }
  #overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    color: #fff7e6;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    pointer-events: none;
    text-align: center;
  }
  #title {
    font-size: 52px; letter-spacing: 6px; font-weight: normal;
    margin-bottom: 6px;
  }
  #subtitle {
    font-size: 16px; letter-spacing: 2px; opacity: 0.85; margin-bottom: 30px;
  }
  #startBtn, #retryBtn {
    pointer-events: all;
    cursor: pointer;
    background: rgba(255,247,230,0.15);
    border: 1px solid rgba(255,247,230,0.6);
    color: #fff7e6;
    padding: 12px 34px;
    border-radius: 30px;
    font-size: 16px;
    letter-spacing: 2px;
    transition: background 0.2s ease;
  }
  #startBtn:hover, #retryBtn:hover { background: rgba(255,247,230,0.3); }
  #hud {
    position: fixed; top: 22px; left: 0; width: 100%;
    display: flex; justify-content: space-between; padding: 0 30px;
    box-sizing: border-box;
    color: #fff7e6; font-size: 20px; letter-spacing: 1px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="jarCount">Fireflies: 0</div>
  <div id="timeLeft">Dusk: 90</div>
</div>

<div id="overlay">
  <div id="title">firefly jar</div>
  <div id="subtitle">move your jar through the dusk &middot; hold click to scoop the light before night falls</div>
  <button id="startBtn">begin</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const hud = document.getElementById('hud');
  const jarCountEl = document.getElementById('jarCount');
  const timeLeftEl = document.getElementById('timeLeft');
  const startBtn = document.getElementById('startBtn');

  let W, H;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Audio ----------
  // Ambient bed: real generated piano loop (assets/ambient.mp3) with a silent
  // procedural-pad fallback if the file fails to load (e.g. offline/blocked).
  let audioCtx = null;
  let padGain = null;
  let ambientEl = null;
  let usingProceduralPad = false;

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    padGain = audioCtx.createGain();
    padGain.gain.value = 0.0;
    padGain.connect(audioCtx.destination);

    ambientEl = new Audio('assets/ambient.mp3');
    ambientEl.loop = true;
    ambientEl.volume = 0;
    ambientEl.crossOrigin = 'anonymous';
    ambientEl.addEventListener('error', startProceduralPad);
    ambientEl.play().then(() => {
      // fade real track in
      let v = 0;
      const target = 0.55;
      const step = () => {
        v = Math.min(target, v + 0.01);
        ambientEl.volume = v;
        if (v < target) requestAnimationFrame(step);
      };
      step();
    }).catch(startProceduralPad);
  }

  function startProceduralPad() {
    if (usingProceduralPad) return;
    usingProceduralPad = true;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 900;
    filter.connect(padGain);

    const notes = [220.0, 277.18, 329.63]; // A3, C#4, E4 - warm major triad
    notes.forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const g = audioCtx.createGain();
      g.gain.value = 0.22 / notes.length;
      osc.connect(g);
      g.connect(filter);
      osc.start();

      const lfo = audioCtx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 0.05 + i * 0.02;
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 3 + i;
      lfo.connect(lfoGain);
      lfoGain.connect(osc.detune);
      lfo.start();
    });

    padGain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 3);
  }

  function fadeAmbient(target) {
    if (ambientEl) {
      const start = ambientEl.volume;
      const t0 = performance.now();
      const dur = 1500;
      function step(now) {
        const p = Math.min(1, (now - t0) / dur);
        ambientEl.volume = start + (target - start) * p;
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    if (padGain) padGain.gain.linearRampToValueAtTime(target * 0.9, audioCtx.currentTime + 1.5);
  }

  function playChime(pitchOffset = 0) {
    if (!audioCtx) return;
    const base = 660 + pitchOffset;
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = base;
    const g = audioCtx.createGain();
    g.gain.value = 0.0001;
    osc.connect(g);
    g.connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
    osc.start(t);
    osc.stop(t + 1.2);

    // soft octave harmonic
    const osc2 = audioCtx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = base * 2;
    const g2 = audioCtx.createGain();
    g2.gain.value = 0.0001;
    osc2.connect(g2);
    g2.connect(audioCtx.destination);
    g2.gain.exponentialRampToValueAtTime(0.06, t + 0.02);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
    osc2.start(t);
    osc2.stop(t + 0.8);
  }

  // ---------- Game state ----------
  const GAME_LEN = 90; // seconds of "dusk"
  let state = 'menu'; // menu | playing | over
  let elapsed = 0;
  let lastTime = 0;
  let caught = 0;
  let mouse = { x: W/2, y: H/2, down: false };
  let jar = { x: W/2, y: H/2, ox: W/2, oy: H/2 }; // ox/oy = smoothed display pos

  const NUM_TREES = 9;
  let trees = [];
  function makeTrees() {
    trees = [];
    for (let i = 0; i < NUM_TREES; i++) {
      trees.push({
        x: (i / (NUM_TREES-1)) * W + (Math.random()-0.5)*60,
        h: H * (0.18 + Math.random()*0.16),
        w: 40 + Math.random()*50
      });
    }
  }
  makeTrees();

  class Firefly {
    constructor() { this.reset(true); }
    reset(initial) {
      this.x = Math.random() * W;
      this.y = H * 0.25 + Math.random() * H * 0.6;
      this.baseY = this.y;
      this.angle = Math.random() * Math.PI * 2;
      this.speed = 0.4 + Math.random() * 0.5;
      // depth: 0 = far/hazy/small, 1 = near/crisp/large — gives the swarm
      // actual parallax dimension instead of every firefly reading as the
      // same flat plane.
      this.depth = Math.random();
      this.radius = 1.6 + this.depth * 2.4;
      this.blinkPhase = Math.random() * Math.PI * 2;
      this.blinkSpeed = 0.03 + Math.random() * 0.03;
      this.turnTimer = Math.random() * 120;
      this.vx = (Math.random()-0.5) * 0.6;
      this.vy = (Math.random()-0.5) * 0.3;
      this.caught = false;
      this.scale = 1;
    }
    update(diffFactor) {
      if (this.caught) return;
      this.turnTimer -= 1;
      if (this.turnTimer <= 0) {
        this.vx += (Math.random()-0.5) * 0.4;
        this.vy += (Math.random()-0.5) * 0.25;
        this.vx = Math.max(-1.3, Math.min(1.3, this.vx)) * diffFactor;
        this.vy = Math.max(-0.7, Math.min(0.7, this.vy));
        this.turnTimer = 60 + Math.random() * 90;
      }
      this.x += this.vx;
      this.y += this.vy + Math.sin(this.blinkPhase * 0.3) * 0.15;
      this.blinkPhase += this.blinkSpeed;

      if (this.x < -20) this.x = W + 20;
      if (this.x > W + 20) this.x = -20;
      if (this.y < H*0.15) this.y = H*0.15;
      if (this.y > H*0.92) this.y = H*0.92;
    }
    glow() {
      // 0..1 blink brightness
      return 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(this.blinkPhase));
    }
    draw() {
      if (this.caught) return;
      const g = this.glow();
      // near fireflies (higher depth) glow brighter/crisper; far ones are
      // softer and dimmer, like they're behind a thin haze — real depth-of-
      // field separation rather than uniform sharpness everywhere.
      const depthDim = 0.55 + this.depth * 0.45;
      const r = this.radius * (1 + g*0.6);
      const glowSpread = r * (6 + (1 - this.depth) * 3);

      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glowSpread);
      grad.addColorStop(0, `rgba(255, 245, 190, ${0.85*g*depthDim})`);
      grad.addColorStop(0.3, `rgba(255, 225, 140, ${0.35*g*depthDim})`);
      grad.addColorStop(1, 'rgba(255, 225, 140, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(this.x, this.y, glowSpread, 0, Math.PI*2);
      ctx.fill();

      // core body
      ctx.fillStyle = `rgba(255, 250, 220, ${(0.9*g + 0.1) * depthDim})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, r, 0, Math.PI*2);
      ctx.fill();

      // tiny hot specular highlight off-center — gives the glow body a
      // dimensional "orb" read instead of a flat blob, especially on the
      // larger near-plane fireflies
      if (this.depth > 0.4) {
        ctx.fillStyle = `rgba(255, 255, 255, ${0.6 * g * depthDim})`;
        ctx.beginPath();
        ctx.arc(this.x - r*0.3, this.y - r*0.3, r*0.35, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }

  const NUM_FIREFLIES = 16;
  let fireflies = [];
  function makeFireflies() {
    fireflies = [];
    for (let i = 0; i < NUM_FIREFLIES; i++) fireflies.push(new Firefly());
  }
  makeFireflies();

  // jar-inside glow particles (visual fill indicator)
  let jarGlows = [];

  function resetGame() {
    elapsed = 0;
    caught = 0;
    jarGlows = [];
    makeFireflies();
    state = 'playing';
    hud.classList.remove('hidden');
    overlay.classList.add('hidden');
    document.body.classList.add('playing');
  }

  // ---------- Input ----------
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
  });
  window.addEventListener('mousedown', () => { mouse.down = true; });
  window.addEventListener('mouseup', () => { mouse.down = false; });
  window.addEventListener('touchmove', e => {
    if (e.touches[0]) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
  }, {passive:true});
  window.addEventListener('touchstart', e => {
    mouse.down = true;
    if (e.touches[0]) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
  }, {passive:true});
  window.addEventListener('touchend', () => { mouse.down = false; });

  startBtn.addEventListener('click', () => {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    resetGame();
  });

  // ---------- Drawing helpers ----------
  function lerp(a, b, t) { return a + (b - a) * t; }

  function skyColors(progress) {
    // progress: 0 = full dusk pink/orange, 1 = deep night
    const top = [
      lerp(70, 12, progress), lerp(40, 8, progress), lerp(90, 40, progress)
    ];
    const mid = [
      lerp(180, 40, progress), lerp(110, 25, progress), lerp(140, 70, progress)
    ];
    const horizon = [
      lerp(255, 40, progress), lerp(170, 30, progress), lerp(140, 80, progress)
    ];
    return { top, mid, horizon };
  }

  function drawBackground(progress) {
    const { top, mid, horizon } = skyColors(progress);
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, `rgb(${top.join(',')})`);
    grad.addColorStop(0.55, `rgb(${mid.join(',')})`);
    grad.addColorStop(1, `rgb(${horizon.join(',')})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Radial vignette "spotlight" glow centered on the moon — the single most
    // characteristic Orisinal depth cue: soft warm light pooling from one
    // source rather than flat ambient color everywhere.
    const moonX = W * 0.82, moonY = H * 0.18;
    const vignette = ctx.createRadialGradient(moonX, moonY, 0, moonX, moonY, W * 0.75);
    vignette.addColorStop(0, `rgba(255, 235, 200, ${0.22 - progress * 0.10})`);
    vignette.addColorStop(0.4, `rgba(255, 220, 180, ${0.10 - progress * 0.05})`);
    vignette.addColorStop(1, 'rgba(255, 220, 180, 0)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);

    // stars fade in as it darkens
    if (progress > 0.15) {
      const starAlpha = Math.min(1, (progress - 0.15) / 0.5);
      ctx.fillStyle = `rgba(255,255,255,${starAlpha})`;
      for (let i = 0; i < 60; i++) {
        const sx = (i * 197) % W;
        const sy = (i * 53) % (H*0.5);
        const tw = 0.5 + 0.5*Math.sin(i*12.9 + elapsed*0.5);
        ctx.globalAlpha = starAlpha * tw;
        ctx.beginPath();
        ctx.arc(sx, sy, 1.2, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // moon: soft glow halo + airbrushed body with a subtle terminator shading
    // (flat light side, slightly cooler/darker limb) instead of a flat disc
    const moonGlow = ctx.createRadialGradient(moonX, moonY, 0, moonX, moonY, 90);
    moonGlow.addColorStop(0, `rgba(255,250,235,${0.35 + 0.25*progress})`);
    moonGlow.addColorStop(1, 'rgba(255,250,235,0)');
    ctx.fillStyle = moonGlow;
    ctx.beginPath();
    ctx.arc(moonX, moonY, 90, 0, Math.PI*2);
    ctx.fill();

    const moonBody = ctx.createRadialGradient(moonX - 10, moonY - 10, 2, moonX, moonY, 36);
    moonBody.addColorStop(0, `rgba(255,255,248,${0.95})`);
    moonBody.addColorStop(0.7, `rgba(255,248,225,${0.75 + 0.2*progress})`);
    moonBody.addColorStop(1, `rgba(230,215,190,${0.55 + 0.2*progress})`);
    ctx.fillStyle = moonBody;
    ctx.beginPath();
    ctx.arc(moonX, moonY, 34, 0, Math.PI*2);
    ctx.fill();

    // ---- layered hills for atmospheric depth: far hill (soft/blurred, cooler,
    // desaturated) -> near hill (sharper, darker, warmer-lit rim) ----
    const groundY = H * 0.86;

    // far hill layer (hazier, lighter, sits higher/further back)
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = `rgba(${lerp(70,20,progress)}, ${lerp(65,20,progress)}, ${lerp(75,30,progress)}, 1)`;
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, groundY - 18);
    for (let x = 0; x <= W; x += 40) {
      const y = groundY - 18 + Math.sin(x*0.003 + 4) * 10;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // near hill (foreground, sharper contrast, subtle rim-light where the
    // moon-side edge catches light)
    ctx.fillStyle = `rgba(${lerp(30,5,progress)}, ${lerp(35,8,progress)}, ${lerp(28,14,progress)}, 1)`;
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, groundY + 20);
    for (let x = 0; x <= W; x += 40) {
      const y = groundY + Math.sin(x*0.004 + 1) * 14;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();

    // rim-light along the near hill's silhouette edge, brightest on the
    // moon-facing side — this is what gives Orisinal scenes their
    // "backlit by a single warm source" look instead of flat silhouettes
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0, groundY + 20);
    for (let x = 0; x <= W; x += 40) {
      const y = groundY + Math.sin(x*0.004 + 1) * 14;
      ctx.lineTo(x, y);
    }
    ctx.strokeStyle = `rgba(255, 225, 180, ${0.35 - progress * 0.18})`;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();

    // tree silhouettes with soft rim-light on the moon-facing side
    ctx.fillStyle = `rgba(${lerp(20,3,progress)}, ${lerp(22,6,progress)}, ${lerp(18,10,progress)}, 1)`;
    trees.forEach(t => {
      ctx.beginPath();
      ctx.moveTo(t.x, groundY + 10);
      ctx.lineTo(t.x - t.w/2, groundY - t.h*0.15);
      ctx.quadraticCurveTo(t.x - t.w*0.6, groundY - t.h*0.6, t.x, groundY - t.h);
      ctx.quadraticCurveTo(t.x + t.w*0.6, groundY - t.h*0.6, t.x + t.w/2, groundY - t.h*0.15);
      ctx.closePath();
      ctx.fill();

      // thin warm rim stroke on the canopy's upper-right curve (moon side)
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(t.x, groundY - t.h);
      ctx.quadraticCurveTo(t.x + t.w*0.6, groundY - t.h*0.6, t.x + t.w/2, groundY - t.h*0.15);
      ctx.strokeStyle = `rgba(255, 230, 190, ${0.25 - progress*0.12})`;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    });

    // subtle ground haze/fog band right at the hill line for depth separation
    const fog = ctx.createLinearGradient(0, groundY - 30, 0, groundY + 30);
    fog.addColorStop(0, 'rgba(255,255,255,0)');
    fog.addColorStop(0.5, `rgba(220,210,220,${0.08 - progress*0.04})`);
    fog.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = fog;
    ctx.fillRect(0, groundY - 30, W, 60);
  }

  function drawJar(x, y, fillRatio, scoopFlash) {
    const jw = 46, jh = 60;
    ctx.save();
    ctx.translate(x, y);

    // soft contact shadow beneath the jar — gives it weight/grounding instead
    // of floating flatly on the scene; a signature Orisinal depth cue
    const shadowGrad = ctx.createRadialGradient(0, jh/2 + 6, 0, 0, jh/2 + 6, jw*0.6);
    shadowGrad.addColorStop(0, 'rgba(10, 8, 15, 0.28)');
    shadowGrad.addColorStop(1, 'rgba(10, 8, 15, 0)');
    ctx.fillStyle = shadowGrad;
    ctx.beginPath();
    ctx.ellipse(0, jh/2 + 6, jw*0.55, jw*0.18, 0, 0, Math.PI*2);
    ctx.fill();

    // glow behind jar from caught fireflies
    if (fillRatio > 0) {
      const glowR = 30 + fillRatio * 40;
      const grad = ctx.createRadialGradient(0, 10, 0, 0, 10, glowR);
      grad.addColorStop(0, `rgba(255,235,170,${0.25 + fillRatio*0.35})`);
      grad.addColorStop(1, 'rgba(255,235,170,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 10, glowR, 0, Math.PI*2);
      ctx.fill();
    }

    // jar body: airbrushed glass with directional shading — darker/cooler on
    // the left (shadow side), lighter/warmer on the right (moon-lit side) —
    // instead of a single flat translucent fill
    const bodyGrad = ctx.createLinearGradient(-jw/2, 0, jw/2, 0);
    bodyGrad.addColorStop(0, scoopFlash ? 'rgba(255,255,255,0.22)' : 'rgba(220,220,240,0.10)');
    bodyGrad.addColorStop(0.5, scoopFlash ? 'rgba(255,255,255,0.30)' : 'rgba(255,255,255,0.14)');
    bodyGrad.addColorStop(1, scoopFlash ? 'rgba(255,245,220,0.30)' : 'rgba(255,240,210,0.16)');
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 2;
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(-jw/2, -jh/2 + 10);
    ctx.quadraticCurveTo(-jw/2, jh/2, 0, jh/2 + 4);
    ctx.quadraticCurveTo(jw/2, jh/2, jw/2, -jh/2 + 10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // glass specular highlight streak — a bright vertical sheen offset to the
    // upper-left, the classic "glass jar catching light" render trick
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-jw/2, -jh/2 + 10);
    ctx.quadraticCurveTo(-jw/2, jh/2, 0, jh/2 + 4);
    ctx.quadraticCurveTo(jw/2, jh/2, jw/2, -jh/2 + 10);
    ctx.closePath();
    ctx.clip();
    const sheen = ctx.createLinearGradient(-jw*0.32, -jh/2, -jw*0.12, jh/2);
    sheen.addColorStop(0, 'rgba(255,255,255,0)');
    sheen.addColorStop(0.5, 'rgba(255,255,255,0.35)');
    sheen.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sheen;
    ctx.fillRect(-jw*0.4, -jh/2, jw*0.28, jh);
    ctx.restore();

    // jar lid: airbrushed metal/wood shading instead of flat fill
    const lidGrad = ctx.createLinearGradient(0, -jh/2 - 12, 0, -jh/2 + 2);
    lidGrad.addColorStop(0, 'rgba(225,198,160,0.9)');
    lidGrad.addColorStop(1, 'rgba(190,158,120,0.85)');
    ctx.fillStyle = lidGrad;
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.roundRect(-jw/2 - 3, -jh/2 - 12, jw + 6, 14, 4);
    ctx.fill();
    ctx.stroke();

    // fireflies glowing inside, count = fillRatio-based sample
    const innerCount = Math.min(jarGlows.length, 30);
    for (let i = 0; i < innerCount; i++) {
      const gph = jarGlows[i];
      const gx = Math.sin(elapsed*1.3 + gph) * (jw*0.28);
      const gy = Math.sin(elapsed*0.9 + gph*1.7) * (jh*0.25) + 2;
      const b = 0.4 + 0.6*Math.abs(Math.sin(elapsed*2 + gph*3));
      // small halo behind each interior glow point for volumetric feel
      const haloGrad = ctx.createRadialGradient(gx, gy, 0, gx, gy, 7);
      haloGrad.addColorStop(0, `rgba(255,235,170,${b*0.5})`);
      haloGrad.addColorStop(1, 'rgba(255,235,170,0)');
      ctx.fillStyle = haloGrad;
      ctx.beginPath();
      ctx.arc(gx, gy, 7, 0, Math.PI*2);
      ctx.fill();

      ctx.fillStyle = `rgba(255,240,180,${b})`;
      ctx.beginPath();
      ctx.arc(gx, gy, 2.2, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.restore();
  }

  // ---------- Main loop ----------
  let scoopCooldown = 0;
  function frame(ts) {
    if (!lastTime) lastTime = ts;
    const dt = (ts - lastTime) / 1000;
    lastTime = ts;

    if (state === 'playing') {
      elapsed += dt;
      const progress = Math.min(1, elapsed / GAME_LEN);
      const diffFactor = 1 + progress * 0.8;

      // smooth jar follow
      jar.ox = lerp(jar.ox, mouse.x, 0.18);
      jar.oy = lerp(jar.oy, mouse.y, 0.18);

      fireflies.forEach(f => f.update(diffFactor));

      // scoop check
      if (mouse.down && scoopCooldown <= 0) {
        let gotOne = false;
        for (const f of fireflies) {
          if (f.caught) continue;
          const dx = f.x - jar.ox, dy = f.y - (jar.oy + 6);
          if (Math.sqrt(dx*dx + dy*dy) < 40) {
            f.caught = true;
            caught++;
            jarGlows.push(Math.random()*100);
            playChime((Math.random()-0.5) * 60);
            gotOne = true;
            setTimeout(() => { f.reset(); }, 3000 + Math.random()*2000);
            break;
          }
        }
        if (gotOne) scoopCooldown = 8;
      }
      if (scoopCooldown > 0) scoopCooldown--;

      jarCountEl.textContent = `Fireflies: ${caught}`;
      const secLeft = Math.max(0, Math.ceil(GAME_LEN - elapsed));
      timeLeftEl.textContent = `Dusk: ${secLeft}`;

      drawBackground(progress);
      fireflies.forEach(f => f.draw());
      drawJar(jar.ox, jar.oy, Math.min(1, caught/30), mouse.down && scoopCooldown > 6);

      if (elapsed >= GAME_LEN) {
        endGame();
      }
    } else if (state === 'menu') {
      drawBackground(0.05);
      fireflies.forEach(f => { f.update(1); f.draw(); });
    } else if (state === 'over') {
      drawBackground(1);
      fireflies.forEach(f => f.draw());
      drawJar(jar.ox, jar.oy, Math.min(1, caught/30), false);
    }

    requestAnimationFrame(frame);
  }

  function endGame() {
    state = 'over';
    hud.classList.add('hidden');
    overlay.classList.remove('hidden');
    document.body.classList.remove('playing');
    document.getElementById('title').textContent = 'night has fallen';
    document.getElementById('subtitle').textContent = `you gathered ${caught} firefl${caught === 1 ? 'y' : 'ies'} of light`;
    startBtn.textContent = 'gather again';
    fadeAmbient(0.2);
  }

  startBtn.addEventListener('click', () => {
    if (state === 'over') {
      fadeAmbient(0.55);
      document.getElementById('title').textContent = 'firefly jar';
      document.getElementById('subtitle').textContent = 'move your jar through the dusk · hold click to scoop the light before night falls';
      startBtn.textContent = 'begin';
    }
  });

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
